<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Indic Transcribe</title>
  <style>
    body {
      font-family: "Noto Sans", "Noto Sans Devanagari", system-ui, sans-serif;
      max-width: 760px; margin: 40px auto; padding: 0 16px;
      background: #f7f6f3; color: #1c1b19; line-height: 1.6;
    }
    h1 { margin-bottom: 4px; }
    .card { background: #fff; border: 1px solid #e3e0d8; border-radius: 12px; padding: 20px; margin-top: 20px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-top: 16px; }
    label { display: flex; flex-direction: column; font-size: 14px; color: #666; gap: 4px; }
    select, button, input { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid #ccc; }
    button { background: #c2410c; color: #fff; border: none; cursor: pointer; padding: 9px 20px; }
    button:disabled { opacity: 0.5; cursor: default; }
    audio { width: 100%; margin-top: 12px; }
    #status { margin-top: 12px; color: #666; }
    #status.error { color: #b91c1c; }
    #text { font-size: 18px; white-space: pre-wrap; }
    .meta { font-size: 14px; color: #666; }
    .seg { font-size: 15px; padding: 2px 0; }
    .seg span { color: #999; font-family: monospace; margin-right: 8px; }
  </style>
</head>
<body>
  <h1>Indic Transcribe</h1>
  <div class="meta">Upload a .wav file in Hindi, English or another Indian language.</div>

  <div class="card">
    <input type="file" id="file" accept=".wav" />
    <audio id="player" controls hidden></audio>

    <div class="row">
      <label>Engine
        <select id="engine">
          <option value="whisper">Whisper (local)</option>
          <option value="sarvam">Sarvam AI</option>
        </select>
      </label>
      <label>Language
        <select id="language"></select>
      </label>
      <button id="go" disabled>Transcribe</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="card" id="result" hidden>
    <div class="meta" id="info"></div>
    <p id="text"></p>
    <div id="segments"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
